<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Control Go2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #030712; color: #f3f4f6;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 360px; margin: 1rem;
      background: #111827; border: 1px solid #1f2937; border-radius: 14px;
      padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .25rem; }
    .sub { color: #6b7280; font-size: .8rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: .75rem; color: #9ca3af; margin: .9rem 0 .35rem; text-transform: uppercase; letter-spacing: .05em; }
    input {
      width: 100%; background: #1f2937; border: 1px solid #374151; color: #f3f4f6;
      border-radius: 8px; padding: .6rem .75rem; font-size: .95rem; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%; margin-top: 1.5rem; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; padding: .7rem; font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    button:hover { background: #1d4ed8; }
    .error {
      margin-top: 1rem; background: #450a0a; border: 1px solid #b91c1c; color: #fca5a5;
      border-radius: 8px; padding: .55rem .75rem; font-size: .8rem; text-align: center;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>Control Go2</h1>
    <p class="sub">Acceso restringido — introduce tus credenciales</p>

    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" autofocus required />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Entrar</button>

    <div id="err" class="error hidden">Usuario o contraseña incorrectos</div>
  </form>

  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('err').classList.remove('hidden')
    }
  </script>
</body>
</html>
